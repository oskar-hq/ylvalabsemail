{# Mail-Fenster: von jeder Karte mit data-mail="<id>" aus. Text kommt fertig aus der Vorlage. #}
<dialog id="mailSheet" class="sheet"><form class="dlg mail-dlg" id="mailForm" autocomplete="off">
  <div class="mail-head">
    <div><h2 id="mailTitle">Mail</h2><p class="muted small" id="mailTo"></p></div>
    <button type="button" class="btn small" data-close aria-label="Schließen">✕</button>
  </div>
  <p class="note small" id="mailNote" hidden></p>
  <label class="field"><span class="sub">Betreff</span><input type="text" name="subject" id="mailSubject"></label>
  <label class="field"><span class="sub">Anrede</span><input type="text" name="greeting" id="mailGreeting"></label>
  <label class="field"><span class="sub">Text <em>Gruß und Unterschrift kommen automatisch dazu</em></span><textarea name="body" id="mailBody" rows="9"></textarea></label>
  <div class="mail-design">
    <span class="sub">Design</span>
    <div class="design-row">
      <span class="segmented small" id="mailTpl" role="group" aria-label="Vorlage"></span>
      <select name="graphic" id="mailGraphic" aria-label="Grafik"></select>
      <select name="icon" id="mailIcon" aria-label="Symbol" hidden></select>
      <button type="button" class="btn small" id="mailSeed" hidden title="Andere Variante des Pixel-Bands">↻ Variante</button>
    </div>
    <input type="hidden" name="template" id="mailTemplateInput">
    <input type="hidden" name="band_seed" id="mailSeedInput">
  </div>
  <details class="mail-preview" id="mailPreviewBox"><summary class="small">Vorschau der Mail</summary>
    <iframe id="mailFrame" title="Vorschau der Mail" sandbox=""></iframe>
  </details>
  <div class="mail-tools small">
    <button type="button" class="link" id="mailTemplate">Vorlage neu einsetzen</button>
    <a id="mailDetail">Akte öffnen</a>
  </div>
  <div class="mail-actions">
    <button type="button" class="btn" id="mailSave">Speichern</button>
    <button type="button" class="btn" id="mailLetter" hidden>Als Brief drucken</button>
    <button type="button" class="btn" data-mark="brief" hidden>Brief ist raus</button>
    <button type="button" class="btn" data-mark="telefon" hidden>Angerufen</button>
    <button type="submit" class="btn primary" id="mailSend">Senden</button>
  </div>
</form></dialog>
