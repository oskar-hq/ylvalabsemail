{% extends "base.html" %}
{% block title %}Neustart · Ylva Labs{% endblock %}
{% block content %}
<main class="page">
  <span class="label">Einstellungen</span>
  <h1 class="title">Startet neu …</h1>
  <p>{{ what }}</p>
  <p class="muted" id="restartMsg">Das dauert ein paar Sekunden. Danach bitte neu anmelden.</p>
  <a class="btn" href="{{ url_for('login') }}" id="restartLink" hidden>Zur Anmeldung</a>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='restarting.js') }}"></script>{% endblock %}
